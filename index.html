<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasta Osteria</title>
    <link rel="stylesheet" href="./Style.css">
    <link rel="icon" type="image/png" href="./Photos/Logo.png">
</head>

<body>

<section class="section-1">


    <!-- GRID დავალება -->

    <h2 class="grid-title">Pasta Osteria - ჩვენი მენიუ</h2>

    <div class="cards">

        <div class="card card-featured">
            <h3>იტალიური პასტა</h3>
            <p>უგემრიელესი იტალიური პასტა.</p>
            <p>ფასი: 35 ₾</p>
        </div>

        <div class="card">
            <h3>პიცა</h3>
            <p>ტრადიციული იტალიური პიცა.</p>
            <p>ფასი: 30 ₾</p>
        </div>

        <div class="card card-tall">
            <h3>ლაზანია</h3>
            <p>კლასიკური იტალიური ლაზანია.</p>
            <p>ფასი: 40 ₾</p>
        </div>

        <div class="card">
            <h3>სპაგეტი</h3>
            <p>სპაგეტი იტალიური სოუსით.</p>
            <p>ფასი: 25 ₾</p>
        </div>

        <div class="card">
            <h3>დესერტი</h3>
            <p>უგემრიელესი ტირამისუ.</p>
            <p>ფასი: 20 ₾</p>
        </div>

    </div>

    <!-- <form>
        <label for="username">Username</label>
        <input type="text" required
        minlength="3" maxlength="10"> 

        <button type="submit">Submit</button>
    </form> -->

    <form>
        <label for="age">Age</label>
        <input type="number" id="age"  min="18" max="30">
    </form>


    <form>
        <label for="date">Date</label>
        <input type="date" min="2026-11-17"
        max="2026-11-25">

        <button type="submit">Submit</button>
    </form>

    <form>
        <label for="username">Username</label>
        <input id="username" type="text" required pattern="^(?=(?:.*[A-Z]){1})(?=(?:.*\d){3})(?=.*[^a-zA-Z0-9]).{5,40}$"
        placeholder="Username...">
    </form>

    <p class="Anim">Hei</p>

    <p class="Anim2">Hai</p>

    <button class="Button">Submit</button>


</section>

</body>
</html>
